name: Protected broadcast button
on: [push, pull_request]
jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install requests psutil fastapi==0.115.6 httpx==0.28.1 pydantic==2.10.6
      - name: Button, prompt and priority contracts
        working-directory: work/race-voices
        run: python -m unittest test_protected_button test_status_button test_status_prompt test_spotter_priority
